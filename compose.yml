services:
  meteranadvanced:
    image: meteranadvanced:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${METERAN_PORT}:8080"
    volumes:
      - meteranadvanced-data:/data
    environment:
      METERAN_SECRET: ${METERAN_SECRET:-}
      METERAN_COOKIE_SECURE: ${METERAN_COOKIE_SECURE:-0}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  meteranadvanced-data:
    name: meteranadvanced-data