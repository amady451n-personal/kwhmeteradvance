services:
  meteranadvanced:
    image: meteranadvanced:latest
    pull_policy: never
    restart: unless-stopped
    # Run as the host owner so the bind-mounted data folder stays writable.
    user: "${METERAN_UID:-1000}:${METERAN_GID:-1000}"
    ports:
      - "${METERAN_PORT}:8080"
    volumes:
      - "${METERAN_DATA_DIR:-./data}:/data"
    environment:
      METERAN_SECRET: ${METERAN_SECRET:-}
      METERAN_COOKIE_SECURE: ${METERAN_COOKIE_SECURE:-0}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s